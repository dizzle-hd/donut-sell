name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: donut-sell
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

      - name: Read mod version
        id: version
        run: echo "mod_version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      # Every push to main (and every v* tag) publishes a GitHub release with the jar.
      - name: Publish release
        if: >-
          github.event_name == 'push' &&
          (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}-build.{1}', steps.version.outputs.mod_version, github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Donut Sell {0} (Build {1})', steps.version.outputs.mod_version, github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          generate_release_notes: true
          files: build/libs/donut-sell-${{ steps.version.outputs.mod_version }}.jar
          fail_on_unmatched_files: true
